name: ragchatbot

services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: ragchatbot_chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/data"
      ANONYMIZED_TELEMETRY: "TRUE"
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data

volumes:
  chroma-data:
